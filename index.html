<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebsiteWerk Leitstand</title>
<style>
:root{--a:#E8590C;--ink:#1A2530;--bg:#EDEFF0;--border:#D8DDE0;--bs:#E4E8EA;--muted:#6B767F;--g:#2F9E44;--amb:#F08C00;--red:#E03131;--rail:212px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden;height:100vh}
#app{display:flex;height:100vh}
aside{width:var(--rail);flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;overflow:auto;display:none}.view.active{display:block}.view:not(.active){display:none}.bv{overflow-x:auto;overflow-y:hidden}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--bs);flex-shrink:0}
.brand .eye{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--a)}
.brand .tit{font-weight:700;font-size:17px;margin-top:3px}
nav{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
nav a{display:flex;align-items:center;gap:9px;padding:8px 11px;border:none;background:none;border-radius:6px;font-size:13px;color:#46535E;cursor:pointer;text-align:left;width:100%;text-decoration:none}
nav a:hover{background:#F2F4F5}
nav a.active{background:var(--ink);color:#fff}
nav a .ic{width:15px;text-align:center;font-size:14px;flex-shrink:0}
.ng{padding:7px 11px 3px;font-family:ui-monospace,monospace;font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:#B8C0C6}
.sf{padding:12px 14px;border-top:1px solid var(--bs);font-size:11px;color:#9AA4AC;line-height:1.55;flex-shrink:0}
.sf .law{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#B8C0C6;margin-bottom:4px}
.sf button{background:none;border:none;color:#9AA4AC;cursor:pointer;font-size:11px;padding:0;margin-top:6px;display:block}
.srow{display:flex;align-items:center;gap:5px;margin-top:8px}
.sd{width:7px;height:7px;border-radius:50%;background:#C5CCD1;flex-shrink:0}
header{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px;flex-shrink:0}
header h1{font-size:15px;font-weight:600}
.hs{margin-left:auto;display:flex;gap:16px}
.hst{text-align:right}.hst .hl{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#9AA4AC}
.hst .hv{font-weight:700;font-family:ui-monospace,monospace;font-size:13px}
.hst .hv.warn{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;transition:opacity .1s}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn:hover:not(:disabled){opacity:.85}
.ba{background:var(--a);color:#fff}.bi{background:var(--ink);color:#fff}.bg{background:#EDF0F2;color:#46535E}.bsm{padding:4px 9px;font-size:12px}
.panel{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ph{padding:10px 16px;border-bottom:1px solid var(--bs);font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#7A858D;display:flex;align-items:center;gap:7px}
.pad{padding:20px;display:flex;flex-direction:column;gap:16px;max-width:1060px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* boards */
.board{display:flex;gap:10px;padding:16px;min-width:max-content;height:100%}
.col{width:280px;flex-shrink:0;display:flex;flex-direction:column;background:#F7F8F9;border:1px solid #DDE2E5;border-radius:8px;max-height:calc(100vh - 142px)}
/* Filter/Suche/Sortierung-Leiste */
.fltbar{display:flex;gap:8px;align-items:center;padding:9px 16px;flex-wrap:wrap;border-bottom:1px solid #E5E9EC;background:#fff}
.fltbar input.fltq{flex:1;min-width:190px;border:1px solid #CBD2D6;border-radius:7px;padding:8px 11px;font-size:13px}
.fltbar input.fltq:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(232,112,74,.12)}
.fltbar select{border:1px solid #CBD2D6;border-radius:7px;padding:7px 9px;font-size:12px;background:#fff;cursor:pointer;max-width:160px}
.fltbar .fltcount{font-size:12px;color:#7A828A;font-weight:700;white-space:nowrap;margin-left:auto}
.fltbar .fltclr{border:1px solid #E3B7B7;background:#fff5f5;color:#d64545;border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer;font-weight:600}
.fltbar .fltclr:hover{background:#ffecec}
.fltbar .fltbulk{border:1px solid #CBD2D6;background:#fff;border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer;font-weight:600}
.fltbar .fltbulk.on{background:#eef4ff;border-color:#0071e3;color:#0071e3}
.col.dok{background:#FFF8F2;border:2px dashed var(--a)}.col.dno{opacity:.3;pointer-events:none}
.ch{padding:9px 10px 6px;display:flex;align-items:center}
.ch .cn{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#5A6670;flex:1}
.ch .cc{font-family:ui-monospace,monospace;font-size:10px;color:#9AA4AC}
.cb{padding:0 6px 6px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ce{font-family:ui-monospace,monospace;font-size:10px;color:#C5CCD1;text-align:center;padding:12px 0}
.card{position:relative;background:#fff;border:1px solid #DDE2E5;border-radius:8px;padding:13px;cursor:grab;transition:box-shadow .15s,border-color .15s,transform .1s}.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08);border-color:#c0c8cd;transform:translateY(-1px)}
.card.picked{border-color:#0071e3;box-shadow:0 0 0 2px rgba(0,113,227,.25);background:#f5faff}
.card.selmode{padding-left:32px}
.card .cpick{position:absolute;top:12px;left:10px;font-size:16px;line-height:1;color:#0071e3;user-select:none}
/* Quick-Action auf Karte (Hover) */
.card .cqarow{position:absolute;bottom:7px;right:7px;display:flex;gap:5px;opacity:0;transition:opacity .12s}
.card:hover .cqarow,.card.pinned .cqarow{opacity:1}
.card .cqa{border:1px solid #DDE2E5;background:#fff;border-radius:6px;padding:2px 8px;font-size:14px;cursor:pointer;line-height:1.2;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.card .cqa:hover{background:#fff5f0;border-color:var(--a)}
.card.pinned{border-left:3px solid #f0b429}
/* Kompakt-Ansicht */
.board.compact .card{padding:8px 11px}
.board.compact .chips,.board.compact .cnxt{display:none}
.board.compact .csub{font-size:10px;margin-top:1px}
.board.compact .card .cqarow{bottom:6px}
.bulkbar{display:flex;gap:8px;align-items:center;padding:8px 16px;flex-wrap:wrap;background:#eef4ff;border-bottom:1px solid #cfe0f7}
.bulkbar b{color:#0071e3}
.bulkbar button{border:1px solid #b9d3f2;background:#fff;border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600;color:#0a5cc4}
.bulkbar button:hover{background:#f0f6ff}
.bulkbar button.prim{background:#0071e3;color:#fff;border-color:#0071e3}
.bulkbar button.prim:hover{background:#005ec0}
/* Gespeicherte Ansichten (Smart Views) */
.viewsrow{display:flex;gap:7px;align-items:center;padding:7px 16px;flex-wrap:wrap;background:#fafbfc;border-bottom:1px solid #EEF1F3}
.viewsrow .vlbl{font-size:11px;color:#8A929A;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.viewchip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #DDE2E5;border-radius:14px;padding:4px 6px 4px 11px;font-size:12px;cursor:pointer;font-weight:600;color:#334}
.viewchip:hover{border-color:var(--a);background:#fff9f6}
.viewchip button{border:none;background:#eef0f2;color:#8A929A;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer;padding:0}
.viewchip button:hover{background:#ffd7d7;color:#d64545}
.card:active{cursor:grabbing}.card:hover{box-shadow:0 2px 8px rgba(26,37,48,.1)}
.card .cnm{font-weight:600;font-size:13px;line-height:1.3}
.card .csub{font-size:11px;color:#8A949C;margin-top:2px}
.card .crow{display:flex;align-items:flex-start;gap:5px;justify-content:space-between}
.card .csc{font-family:ui-monospace,monospace;font-size:11px;padding:1px 5px;border-radius:3px;background:#EDF0F2;color:#5A6670;flex-shrink:0}
.card .csc.hot{background:#FFF4E6;color:var(--a)}
.card .cmrr{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
.card .cnxt{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;color:var(--muted)}
.card .cnxt.od{color:var(--red)}
.card .chips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.chip{font-family:ui-monospace,monospace;font-size:9px;padding:1px 5px;border-radius:3px;background:#EDF2F7;color:#4A5568}
.chip.ok{background:#EBFBEE;color:var(--g)}.chip.hot2{background:#FFF4E6;color:var(--a)}.chip.live{background:#E3FAFC;color:#0C8599}
.dot9{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
/* heute */
.fi{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #EFF2F3;cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;font-size:13px}
.fi:last-child{border-bottom:none}.fi:hover{background:#FAFBFB}
.fi .fn{font-family:ui-monospace,monospace;color:#C5CCD1;width:15px;font-size:12px}
.fi .ft{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .fc{font-size:11px;color:#9AA4AC;flex-shrink:0}
.alert-bar{border:1px solid var(--red);background:#FFF5F5;border-radius:8px;padding:12px 16px;font-size:13px;display:flex;gap:9px;align-items:center}
.mi{padding:9px 16px;border-bottom:1px solid #EFF2F3;font-size:13px;display:flex;cursor:pointer}
.mi:last-child{border-bottom:none}.mi:hover{background:#FAFBFB}
.empty{padding:16px;font-size:13px;color:#9AA4AC;line-height:1.6}
.wx-card{background:#fff;border:1px solid #DDE2E5;border-radius:10px;padding:18px}
.wx-title{font-size:13px;font-weight:700;letter-spacing:.02em;color:#1A2530;margin-bottom:12px}
.wx-table{width:100%;border-collapse:collapse;font-size:13px}
.wx-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8A949C;padding:8px 10px;border-bottom:1px solid #E3E8EB}
.wx-table td{padding:10px;border-bottom:1px solid #EEF1F3;vertical-align:top;color:#34404A}
.wx-table tr:last-child td{border-bottom:none}
.wx-table code{font-family:ui-monospace,monospace;font-size:12px;background:#EDF0F2;padding:1px 6px;border-radius:4px;color:#5A6670}
.wx-sub{font-size:11px;color:#8A949C}
.wx-empty{padding:18px 10px;text-align:center;color:#9AA4AC;font-size:13px}
.wx-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.wx-kpi{background:#F7F9FA;border:1px solid #E6EAED;border-radius:8px;padding:12px}
.wx-kv{font-size:19px;font-weight:700;color:#1A2530;line-height:1.1}
.wx-kl{font-size:11px;color:#8A949C;margin-top:3px}
.wx-bars{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wx-bar{display:flex;align-items:center;gap:8px;background:#F7F9FA;border:1px solid #E6EAED;border-radius:999px;padding:5px 12px;font-size:12px;color:#5A6670}
.wx-bar b{color:#1A2530}
.wx-btn{font-size:12px;font-weight:600;background:var(--a,#e8704a);color:#fff;border:none;border-radius:7px;padding:6px 12px;cursor:pointer}
.wx-btn:hover{filter:brightness(1.05)}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tagc{display:inline-flex;align-items:center;gap:5px;background:#EAF1FB;color:#1763c6;font-size:12px;font-weight:600;padding:3px 6px 3px 9px;border-radius:999px}
.tagc button{background:none;border:none;color:#1763c6;cursor:pointer;font-size:14px;line-height:1;padding:0;opacity:.7}
.tagc button:hover{opacity:1}
.tag-in{width:100%;border:1px solid #CBD2D6;border-radius:6px;padding:7px 9px;font-size:13px}
.note-add{display:flex;gap:8px;margin-bottom:10px}
.note-add textarea{flex:1;border:1px solid #CBD2D6;border-radius:6px;padding:8px 9px;font-size:13px;font-family:inherit;resize:vertical}
.notes{display:flex;flex-direction:column;gap:8px}
.note{border-left:2px solid var(--a,#e8704a);background:#FAFBFC;border-radius:0 8px 8px 0;padding:8px 12px}
.note-t{font-size:10px;color:#9AA4AC;font-family:ui-monospace,monospace;margin-bottom:2px}
.note-x{font-size:13px;color:#2B3640;white-space:pre-wrap;line-height:1.5}
.chip.tagchip{background:#EAF1FB;color:#1763c6}
.task-add{display:flex;gap:6px;margin-bottom:9px}
.task-add input[type=text],.task-add>input:first-child{flex:1;border:1px solid #CBD2D6;border-radius:6px;padding:7px 9px;font-size:13px}
.task-add input:first-child{flex:1;border:1px solid #CBD2D6;border-radius:6px;padding:7px 9px;font-size:13px}
.task-add input[type=date]{border:1px solid #CBD2D6;border-radius:6px;padding:6px;font-size:12px}
.tasks{display:flex;flex-direction:column;gap:5px}
.task{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid #E3E8EB;border-radius:7px;background:#fff}
.task input[type=checkbox]{width:16px;height:16px;accent-color:var(--g,#2f9e44);cursor:pointer;flex:none}
.task .tx{flex:1;font-size:13px;color:#2B3640}
.task .td{font-size:11px;color:#9AA4AC;font-family:ui-monospace,monospace;white-space:nowrap}
.task.od{border-color:#f3c2c2;background:#fff6f6}.task.od .td{color:var(--red,#e03131);font-weight:700}
.task.done{opacity:.55}.task.done .tx{text-decoration:line-through}
.task .trm{background:none;border:none;color:#c0c8cd;cursor:pointer;font-size:15px;line-height:1;padding:0}.task .trm:hover{color:var(--red,#e03131)}
.seq{display:flex;flex-direction:column;gap:8px}
.seqstep{border:1px solid #E3E8EB;border-radius:9px;padding:11px 13px;background:#fff;position:relative}
.seqh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.seqn{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a,#e8704a)}
.seqw{font-size:10px;color:#9AA4AC;font-family:ui-monospace,monospace}
.seqsub{font-weight:700;font-size:13px;color:#1A2530;margin-bottom:5px}
.seqtx{font-size:12.5px;color:#3A4650;white-space:pre-wrap;line-height:1.55}
.seqcopy{margin-top:8px;background:#EDF0F2;border:none;border-radius:6px;padding:5px 11px;font-size:11px;font-weight:600;color:#5A6670;cursor:pointer}
.seqcopy:hover{background:#e0e5e8}
@media(max-width:760px){.wx-kpis{grid-template-columns:repeat(2,1fr)}}
/* finder */
.fcats{display:flex;flex-wrap:wrap;gap:6px}
.fcat{border:1px solid #CBD2D6;border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;background:#fff;user-select:none}
.fcat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#8A949C;border-bottom:1px solid var(--bs);background:#FAFBFB;position:sticky;top:0;z-index:1}
td{padding:8px 12px;border-bottom:1px solid #F2F3F4}
tr:hover td{background:#FAFBFB}
.tag{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;padding:1px 5px;border-radius:3px}
.tg{background:#FFF4E6;color:var(--a);font-weight:600}.ts{background:#EDF0F2;color:#5A6670}
/* protokoll */
.lr{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #EFF2F3;font-size:13px}
.lr .lts{font-family:ui-monospace,monospace;font-size:10px;color:#9AA4AC;width:86px;flex-shrink:0}
.lr .len{font-weight:500;width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{font-family:ui-monospace,monospace;font-size:10px;padding:1px 6px;border-radius:3px;background:#EDF0F2;color:#5A6670;white-space:nowrap}
.bdg.act{background:var(--ink);color:#fff}.bdg.dan{background:var(--red);color:#fff}
.lr .lno{color:#8A949C;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actr{font-family:ui-monospace,monospace;font-size:10px;padding:1px 6px;border-radius:3px;flex-shrink:0}
.actr.au{background:#EDF2F7;color:#4A5568}.actr.ma{background:#FFF4E6;color:var(--a)}
/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(26,37,48,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mo{background:#fff;border-radius:10px;box-shadow:0 24px 56px rgba(0,0,0,.28);padding:20px;width:440px;max-width:100%;max-height:92vh;overflow:auto}
.mo.wide{width:600px}.mo.xl{width:760px}
.mo h3{font-family:ui-monospace,monospace;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--a);margin-bottom:5px}
.tline{display:flex;align-items:center;gap:7px;margin-bottom:14px}
.mf{margin-bottom:12px}.mf label{display:block;font-size:11px;font-weight:600;color:#5A6670;margin-bottom:4px}
.mf input,.mf select,.mf textarea{width:100%;border:1px solid #CBD2D6;border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff}
.abox{background:#F4F6F7;border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.abox .ah{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#9AA4AC;margin-bottom:6px}
.astep{display:flex;align-items:flex-start;gap:6px;padding:3px 0;color:#5A6670;font-size:12px}
.astep .ai{width:13px;text-align:center;flex-shrink:0}.astep.pending{opacity:.4}
.astep.done .ai{color:var(--g)}.astep.err .ai{color:var(--red)}.astep.run .ai{color:var(--a)}
.dr{position:fixed;top:0;right:0;bottom:0;width:400px;background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(26,37,48,.1);z-index:40;display:flex;flex-direction:column}
.drh{padding:15px 16px;border-bottom:1px solid var(--bs);display:flex;align-items:flex-start;gap:9px}
.drb{padding:16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.kv2 .kl{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#9AA4AC;margin-bottom:2px}
.tli{border-left:2px solid #CBD2D6;padding-left:10px;margin-bottom:10px;font-size:12px}
.tli.man{border-color:var(--a)}
.tli .twh{font-family:ui-monospace,monospace;font-size:9.5px;color:#9AA4AC}
.tli .twt{color:#3A4750;margin-top:1px}.tli .twn{font-size:11px;color:#8A949C;margin-top:2px}
.xb{background:none;border:none;cursor:pointer;color:#9AA4AC;font-size:18px;line-height:1;margin-left:auto}
.xb:hover{color:#5A6670}
.stit{font-family:ui-monospace,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#9AA4AC;margin-bottom:6px}
.hint{font-size:12px;color:#8A949C;line-height:1.55}
.tw{background:#F4F6F7;border-radius:6px;padding:10px;font-size:12px;line-height:1.55}
.tw b{color:#3A4750}
/* factory steps */
.fstep{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid #EFF2F3;font-size:13px}
.fstep:last-child{border-bottom:none}
.fstep .fnum{font-family:ui-monospace,monospace;font-size:10px;width:17px;flex-shrink:0;color:#B8C0C6}
.fstep .flab{flex:1;min-width:0}
.fstep .fi2{font-size:11px;color:#8A949C;display:block;margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.fstep .fic{width:18px;flex-shrink:0;text-align:center;font-size:13px}

rBoard(w){
 const acq=w==="akquise",stages=acq?AS:CS,all=acq?this.state.leads:this.state.clients,kF=acq?"stage":"phase",pl=acq?"acq":"cli",tm=acq?AT:CT;
 this.flt=this.flt||{};this.flt[w]=this.flt[w]||{q:"",branche:"",minScore:0,tag:"",sort:"default"};
 const items=this.applyBoardFilter(all,w);
 const al=this.drag&&this.drag.pl===pl?new Set(tm[this.drag.from]||[]):null;
 document.getElementById("v-"+w).innerHTML=this.boardToolbar(w,items.length,all.length)+`<div class="board${(this.compact&&this.compact[w])?" compact":""}">${stages.map(st=>{
  const cards=items.filter(i=>i[kF]===st.id);
  let cls="col";if(al){if(al.has(st.id))cls+=" dok";else if(st.id!==this.drag.from)cls+=" dno";}
  return`<div class="${cls}" ondragover="App.dOver(event,'${pl}','${st.id}')" ondrop="App.dDrop(event,'${pl}','${st.id}')">
   <div class="ch"><span class="cn" ${st.t?'style="color:#A8B1B8"':''}>${st.l}</span><span class="cc">${cards.length}</span></div>
   <div class="cb">${cards.length?cards.map(c=>this.cardH(c,pl,st.id)).join(""):`<div class="ce">leer</div>`}</div>
  </div>`;}).join("")}</div>`;
 if(this._fltFocus===w){const si=document.getElementById("fltq-"+w);if(si){const v=si.value;si.focus();si.setSelectionRange(v.length,v.length);}}
},
applyBoardFilter(all,w){
 const f=(this.flt&&this.flt[w])||{};const norm=s=>String(s||"").toLowerCase();
 let out=all.filter(i=>{
  if(f.q){const q=norm(f.q);if(!(norm(i.name).includes(q)||norm(i.branche).includes(q)||norm(i.ort).includes(q)))return false;}
  if(f.branche&&norm(i.branche)!==norm(f.branche))return false;
  if(f.minScore&&(+i.score||0)<f.minScore)return false;
  if(f.tag&&!(i.tags||[]).map(norm).includes(norm(f.tag)))return false;
  return true;
 });
 if(f.sort==="score")out=out.slice().sort((a,b)=>(+b.score||0)-(+a.score||0));
 else if(f.sort==="name")out=out.slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));
 else if(f.sort==="due")out=out.slice().sort((a,b)=>String(a.next?.due||"9999").localeCompare(String(b.next?.due||"9999")));
 else if(f.sort==="new")out=out.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 out=out.filter(i=>i.pinned).concat(out.filter(i=>!i.pinned)); // gepinnte immer zuerst
 return out;
},

/* ==========================================================
   FACTORY ENGINE v4 – Backend-gesteuert
   Alle schweren Jobs laufen auf Render (websitewerk-api).
   Das Frontend startet den Job und pollt den Status.
   Keys (Claude, Pexels, Cloudflare) liegen nur auf dem Server.
   ========================================================== */

/* Factory-Modal */
fSet(i,state,info){if(!this.fact)return;this.fact.steps[i].state=state;if(info!==undefined)this.fact.steps[i].info=info;this.rFactory();},
rFactory(){
 const R=document.getElementById("FR");if(!this.fact){R.innerHTML="";return;}
 const f=this.fact,running=f.steps.some(s=>s.state==="run")||!f.doneAll;
 const ic={pending:"○",run:'<span class="sp"></span>',done:"✓",err:"✕",skip:"—"};
 R.innerHTML=`<div class="ov" onclick="if(event.target===this&&!${running})App.closeFactory()">

   </div>
   ${f.steps.map((s,i)=>`<div class="fstep ${s.state!=="pending"?"f"+s.state:"fpend"}">
    <span class="fnum">${i+1}</span>

   ${f.doneAll?`<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">

    ${f.pingenReady?`<button class="btn ba" onclick="App.sendPingenBrief('${f.leadId}')">📮 Brief jetzt versenden (Pingen)</button>`:""}
    <button class="btn bi" onclick="App.closeFactory()">Fertig</button>
   </div>`:running?`<div style="margin-top:14px;border-top:1px solid var(--bd,#e5e5e5);padding-top:12px">

    <p class="hint" style="margin:0;opacity:.75">Läuft seit <span id="factory-elapsed">0m 00s</span>${f.info?" · "+esc(f.info):""}<br>
    Der Build läuft auf dem Server weiter, auch wenn du das Fenster schließt.
    Mit KI-Film (Welt-Modus) dauert er <b>20–40 Minuten</b> — die meiste Zeit geht für Kling-Clips und das 4K-Hochrechnen drauf.</p>

},
closeFactory(){if(this.fact?._poll)clearInterval(this.fact._poll);if(this.fact?._ticker)clearInterval(this.fact._ticker);this.fact=null;document.getElementById("FR").innerHTML="";this.renderAll();},

/* === Hauptdurchlauf === */
async runFactory(lid){
 const lead=this.state.leads.find(l=>l.id===lid);if(!lead)return;
 const apiBase=(this.cfg.apiUrl||"https://websitewerk-api.onrender.com").replace(/\/$/,"");
 /* Prüfen ob Backend erreichbar */
 try{const h=await fetch(apiBase+"/health");if(!h.ok)throw new Error(h.status);}
 catch(e){this.toast("Backend nicht erreichbar ("+apiBase+") – Einstellungen prüfen");this.show("einstellungen");return;}
 /* Schritte = was der Build WIRKLICH tut (Reihenfolge = factoryStep 1..9).
    Der Live-Text darunter kommt vom Backend (factoryPhase). */
 this.fact={leadId:lid,name:lead.name,_poll:null,steps:[
  {label:"Recherche – Website, Google-Profil, Bilder, Schema",state:"pending"},
  {label:"Company Twin – verstehen, was der Betrieb wirklich ist",state:"pending"},
  {label:"Bildmaterial sammeln + filtern",state:"pending"},
  {label:"Struktur + Design-Pack festlegen",state:"pending"},
  {label:"Agentur + Welt-Medien (KI-Film, 4K, Frames) – längster Schritt",state:"pending"},
  {label:"Seiten bauen",state:"pending"},
  {label:"Qualitätsprüfung – Gates + Kritiker",state:"pending"},
  {label:"Deploy (Cloudflare Pages) + PageSpeed",state:"pending"},
  {label:"Fertig – verkaufsbereit",state:"pending"}
 ],doneAll:false,demoUrl:null,localHtml:false,briefOk:false,pingenReady:false,phase:null,info:null};
 this.rFactory();
 /* Backend-Job starten */
 try{
  const resp=await fetch(apiBase+"/api/factory/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({leadId:lid})});
  if(!resp.ok){const t=await resp.text();throw new Error("Backend "+resp.status+": "+t.slice(0,120));}
 }catch(e){
  this.fSet(0,"err","Backend-Fehler: "+e.message);
  if(this.fact){this.fact.doneAll=true;this.rFactory();}
  return;
 }
 this.fSet(0,"run","Backend-Job gestartet – Build läuft auf Render (4–8 Min)…");
 /* Polling alle 3 Sek. */
 const _this=this;
 let lastStep=-1,stuckCount=0;
 /* Elapsed-Time-Ticker */
 const _startTs=Date.now();
 const _ticker=setInterval(()=>{
  const el=document.getElementById('factory-elapsed');
  if(!el||_this.fact?.doneAll){clearInterval(_ticker);return;}
  const s=Math.floor((Date.now()-_startTs)/1000);
  el.textContent=Math.floor(s/60)+'m '+('0'+(s%60)).slice(-2)+'s';
 },1000);
 this.fact._ticker=_ticker;
 this.fact._poll=setInterval(async()=>{
  try{
   const sr=await fetch(apiBase+"/api/factory/status/"+lid);
   if(!sr.ok)return;
   const st=await sr.json();
   const step=st.factoryStep||0;
   /* Live-Text + Kennzahlen aus dem Build (statt geraten) */
   const infoBits=[];
   if(st.buildLevel)infoBits.push(st.buildLevel==="signature"?"Signature":st.buildLevel);
   if(st.designPack)infoBits.push(st.designPack);
   if(st.world&&st.world.fonts)infoBits.push(st.world.fonts);
   if(st.world&&st.world.seiten)infoBits.push(st.world.seiten+" Seite(n) mit Film");
   if(st.buildPages)infoBits.push(st.buildPages+" Seiten");
   if(st.costEur)infoBits.push(st.costEur.toFixed(2).replace(".",",")+" €"+(st.mediaCount?(" · "+st.mediaCount+" Medien"):""));
   const newPhase=st.factoryPhase||null,newInfo=infoBits.join(" · ")||null;
   if(newPhase!==_this.fact.phase||newInfo!==_this.fact.info){
    _this.fact.phase=newPhase;_this.fact.info=newInfo;_this.rFactory();
   }
   /* Steps animieren */
   if(step>lastStep){
    for(let i=lastStep+1;i<step;i++)_this.fSet(i,"done");
    if(step<_this.fact.steps.length)_this.fSet(step,"run",newPhase||"");
    lastStep=step;stuckCount=0;
   }else{stuckCount++;}
   /* Abschluss-Status */
   const done=["sales_ready","review_needed","blocked"].includes(st.stage);
   const err=!!st.factoryError;
   if(done||err||stuckCount>900){
    clearInterval(_this.fact._poll);
    /* Frischen State aus Supabase laden */
    const fresh=await _this.sbLoad();
    if(fresh){_this.state=fresh;_this.persist();}
    const freshLead=_this.state.leads.find(l=>l.id===lid);
    if(err){

    }else if(st.stage==="review_needed"){
     for(let i=lastStep+1;i<_this.fact.steps.length;i++)_this.fSet(i,"skip");
    }else{
     for(let i=lastStep+1;i<_this.fact.steps.length;i++)_this.fSet(i,"done");
    }
    _this.fact.doneAll=true;
    _this.fact.demoUrl=freshLead?.demoUrl||null;

    _this.rFactory();_this.renderAll();

  }catch(e){console.warn("Poll-Fehler:",e.message);}
 },3000);

async deployCFPages(lead,pages,projectSlug){
 const acc=this.cfg.cfAccount.trim(),proj=this.cfg.cfProject.trim(),tok=this.cfg.cfToken.trim();
 const fd=new FormData();
 const manifest={};
 for(const[page,html] of Object.entries(pages)){
  const fname=page==="Start"?"index.html":slug(page)+".html";
  manifest["/demos/"+projectSlug+"/"+fname]={hash:b64(page).slice(0,8),size:html.length,httpStatus:200,contentType:"text/html"};
  fd.append("/demos/"+projectSlug+"/"+fname,new Blob([html],{type:"text/html"}),fname);
 }
 /* Impressum + Datenschutz Platzhalter */
 const legal="<!DOCTYPE html><html lang='de'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Platzhalter</title></head><body style='font-family:system-ui;padding:40px;max-width:800px;margin:0 auto'><h1>Rechtlicher Hinweis</h1><p>Diese Seite wird vom Kunden mit finalen Rechtstexten befüllt (Empfehlung: eRecht24 / IT-Recht Kanzlei).</p><p><a href='index.html'>← Zurück</a></p></body></html>";
 manifest["/demos/"+projectSlug+"/impressum.html"]={hash:"aaaa0001",size:legal.length,httpStatus:200,contentType:"text/html"};
 manifest["/demos/"+projectSlug+"/datenschutz.html"]={hash:"aaaa0002",size:legal.length,httpStatus:200,contentType:"text/html"};
 fd.append("/demos/"+projectSlug+"/impressum.html",new Blob([legal],{type:"text/html"}),"impressum.html");
 fd.append("/demos/"+projectSlug+"/datenschutz.html",new Blob([legal],{type:"text/html"}),"datenschutz.html");
 fd.append("manifest",JSON.stringify(manifest));
 const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${acc}/pages/projects/${proj}/deployments`,{method:"POST",headers:{"Authorization":"Bearer "+tok},body:fd});
 if(!r.ok){const t=await r.text();throw new Error("CF "+r.status+": "+t.slice(0,200));}
 const d=await r.json();
 if(!d.success)throw new Error(JSON.stringify(d.errors||d).slice(0,200));
 return(d.result?.url||`https://${proj}.pages.dev`)+"/demos/"+projectSlug+"/";
},

async nlDraft(){

  const r=await fetch(this.apiBase()+"/api/newsletter/draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({thema:thema||undefined})});

async nlSend(test){
 const betreff=(document.getElementById("nl-betreff")?.value||"").trim();
 const html=(document.getElementById("nl-html")?.value||"").trim();
 const segment=document.getElementById("nl-seg")?.value||"clients";
 if(!betreff||!html){this.toast("Betreff und Inhalt nötig");return;}
 if(!test&&!confirm("Newsletter wirklich an Segment „"+segment+"\" senden?"))return;
 this.toast(test?"✉️ Sende Testmail …":"🚀 Versende Newsletter …");
 try{
  const r=await fetch(this.apiBase()+"/api/newsletter/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({betreff,html,segment,test})});
  const d=await r.json();
  if(!r.ok||!d.ok)throw new Error(d.error||"Fehler");

async updateRequest(clientId,reqId){

finder:{res:[],loading:false,cats:["handwerk","gastro","beauty"],radius:20,lat:48.8362,lon:10.0934,ort:"Aalen"},
CATS:{handwerk:{l:"Handwerk",q:'nwr["craft"](around:{R},{LAT},{LON});'},gastro:{l:"Gastro",q:'nwr["amenity"~"^(restaurant|cafe|fast_food|bar|biergarten)$"](around:{R},{LAT},{LON});'},beauty:{l:"Beauty",q:'nwr["shop"~"^(hairdresser|beauty|cosmetics|nail_salon)$"](around:{R},{LAT},{LON});'},fitness:{l:"Fitness",q:'nwr["leisure"~"^(fitness_centre|sports_centre)$"](around:{R},{LAT},{LON});'},gesundheit:{l:"Praxen",q:'nwr["amenity"~"^(dentist|doctors|physiotherapist)$"](around:{R},{LAT},{LON});'},auto:{l:"KFZ",q:'nwr["shop"~"^(car|car_repair|tyres)$"](around:{R},{LAT},{LON});'},fahrschule:{l:"Fahrschule",q:'nwr["amenity"="driving_school"](around:{R},{LAT},{LON});'},hotel:{l:"Hotels",q:'nwr["tourism"~"^(hotel|guest_house|hostel)$"](around:{R},{LAT},{LON});'},industrie:{l:"Industrie",q:'nwr["craft"~"^(metal_construction|electrician|plumber|hvac|carpenter)$"](around:{R},{LAT},{LON});'},pflege:{l:"Pflege",q:'nwr["amenity"~"^(nursing_home|social_facility)$"](around:{R},{LAT},{LON});'},bildung:{l:"Bildung",q:'nwr["amenity"~"^(school|kindergarten|language_school)$"](around:{R},{LAT},{LON});'}},

 document.getElementById("v-finder").innerHTML=`<div class="pad" style="max-width:1060px">

   </div>

  ${f.res.length?`<div class="panel">

toggleCat(k){const c=this.finder.cats;c.includes(k)?this.finder.cats=c.filter(x=>x!==k):c.push(k);this.rFinder();},
async searchLeads(){
 const f=this.finder;f.ort=document.getElementById("fo").value.trim()||"Aalen";f.radius=Math.min(50,Math.max(1,+document.getElementById("fr").value||20));
 if(!f.cats.length){this.toast("Mindestens eine Branche wählen");return;}
 f.loading=true;f.res=[];this.rFinder();
 try{
  const geo=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q=${encodeURIComponent(f.ort)}`,{headers:{"Accept":"application/json","User-Agent":"WebsiteWerk-Leitstand/1.0"}}).then(r=>r.json());
  if(geo.length){f.lat=+geo[0].lat;f.lon=+geo[0].lon;}
  const R=f.radius*1000;
  const body="[out:json][timeout:45];("+f.cats.map(k=>this.CATS[k].q.replaceAll("{R}",R).replaceAll("{LAT}",f.lat).replaceAll("{LON}",f.lon)).join("")+");out tags center 500;";
  const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(body),headers:{"Content-Type":"application/x-www-form-urlencoded"}}).then(r=>r.json());
  const seen=new Set(this.state.leads.map(l=>l.name.toLowerCase()));
  const catOf=t=>{if(t.craft)return"Handwerk ("+t.craft+")";if(t.amenity==="restaurant")return"Restaurant";if(t.amenity==="cafe")return"Café";if(t.amenity==="fast_food")return"Imbiss";if(t.amenity==="bar")return"Bar";if(t.amenity==="biergarten")return"Biergarten";if(t.shop==="hairdresser")return"Friseur";if(["beauty","cosmetics"].includes(t.shop))return"Beauty/Kosmetik";if(t.shop==="nail_salon")return"Nagelstudio";if(t.leisure==="fitness_centre")return"Fitness";if(t.leisure==="sports_centre")return"Sportzentrum";if(t.amenity==="dentist")return"Zahnarzt";if(t.amenity==="doctors")return"Arztpraxis";if(t.amenity==="physiotherapist")return"Physiotherapie";if(t.shop==="car")return"Autohaus";if(t.shop==="car_repair")return"KFZ-Werkstatt";if(t.shop==="tyres")return"Reifenhandel";if(t.amenity==="driving_school")return"Fahrschule";if(t.tourism==="hotel")return"Hotel";if(t.tourism==="guest_house")return"Pension";if(t.amenity==="nursing_home")return"Pflegeheim";if(t.amenity==="social_facility")return"Soziale Einrichtung";return"Sonstiges";};
  f.res=(res.elements||[]).filter(e=>e.tags?.name).map(e=>{const t=e.tags,website=t.website||t["contact:website"]||"",phone=t.phone||t["contact:phone"]||"";let sc=50;if(!website)sc+=25;if(phone)sc+=10;if(t["addr:city"])sc+=5;if(t["addr:street"])sc+=3;if(t.email||t["contact:email"])sc+=5;return{name:t.name,branche:catOf(t),ort:t["addr:city"]||t["addr:town"]||f.ort,website,phone,score:Math.min(sc,95),sel:!website&&!seen.has(t.name.toLowerCase()),dupe:seen.has(t.name.toLowerCase())};}).filter(r=>!r.dupe).sort((a,b)=>b.score-a.score);
  if(!f.res.length)this.toast("Keine Treffer – Radius vergrößern oder andere Branchen");
 }catch(e){console.error(e);this.toast("Suche fehlgeschlagen – Overpass kurz überlastet, 1 Min. warten");}
 f.loading=false;this.rFinder();
},
checkAll(v){this.finder.res.forEach(r=>r.sel=v);this.rFinder();},

 const ids=[];
 sel.forEach(r=>{const id=uid();ids.push(id);this.state.leads.unshift({id,name:r.name,branche:r.branche,ort:r.ort,score:r.score,stage:"discovered",website:r.website||"",phone:r.phone||"",next:{label:"Factory-Durchlauf starten",due:today()}});this.state.events.push({id:uid(),ts:Date.now(),pipeline:"acq",from:"—",to:"discovered",actor:"System",entity:r.name,note:"Lead-Finder importiert"});});

 this.persist();this.toast(sel.length+" Leads importiert → Akquise");this.rFinder();

 else this.show("akquise");

  <div class="cfg-sec">
   <div class="stit" style="color:var(--a);font-size:11px">STUFE B · Klick-Tracking-Webhook (n8n auf Hetzner)</div>
   <p class="hint" style="margin-bottom:10px">Wenn n8n läuft: Webhook-URL hier eintragen. Bei Demo-Link-Klick wird eine POST-Anfrage gesendet → n8n setzt Lead auf "Engaged" + Push-Benachrichtigung. Setup in SETUP-ANLEITUNG.md (n8n-Workflow-JSON importieren).</p>

 </div></div>`;

},
async loadBackups(){const el=document.getElementById("backup-status");if(!el)return;el.textContent="Lade …";try{const r=await fetch(this.apiBase()+"/api/admin/backups");const d=await r.json();if(!d.ok)throw new Error(d.error||"Fehler");const b=d.backups||[];el.innerHTML=(b.length?b.map(x=>`<div>💾 <b>${esc(x.slot.replace("ww-backup-","Slot "))}</b> · ${new Date(x.updated_at).toLocaleString("de-DE")} · ${x.clients} Kunden · ${x.leads} Leads · ${x.events} Events</div>`).join(""):"<div>Noch keine Auto-Backups — das erste entsteht beim nächsten Speichern (Intervall 8h).</div>")+(d.main?`<div style="margin-top:4px;color:#9AA4AC">Aktuell (main): ${d.main.clients} Kunden · ${d.main.leads} Leads · ${d.main.events} Events</div>`:"");}catch(e){el.textContent="Backup-Status nicht ladbar (Leitstand-Schlüssel gesetzt?): "+e.message;}},
async saveSettings(){
 const g=id=>document.getElementById(id)?.value.trim()||"";
 Object.assign(this.cfg,{apiUrl:g("c-api"),pexKey:g("c-pex"),cfAccount:g("c-cfa"),cfProject:g("c-cfp"),cfToken:g("c-cft"),pingenKey:g("c-pgk"),pingenOrg:g("c-pgo"),n8nWebhook:g("c-n8n"),absFirma:g("c-fn"),absName:g("c-nn"),absStrasse:g("c-str"),absOrt:g("c-ort"),absTel:g("c-tel"),absMail:g("c-mail"),sbUrl:g("c-sbu"),sbKey:g("c-sbk")});
 localStorage.setItem("ww:cfg",JSON.stringify(this.cfg));
 // Leitstand-Schlüssel (x-ww-key) separat in localStorage — der fetch-Wrapper liest ihn dort.
 const _wk=g("c-wwkey"); if(_wk)localStorage.setItem("ww_api_key",_wk); else localStorage.removeItem("ww_api_key");
 // IMMER zuerst echten Cloud-State laden (über Backend, auch ohne Dashboard-Credentials)
 const cloudState=await this.sbLoadViaBackend()||(this.cfg.sbUrl&&this.cfg.sbKey?await this.sbLoad():null);
 if(cloudState&&(cloudState.leads?.length||cloudState.clients?.length)){
   // Echter Cloud-Stand vorhanden → immer laden (keine Demo-Daten zeigen)
   this.state=cloudState;
   this.persist();
   this.toast("✓ "+(cloudState.leads?.length||0)+" Leads aus der Cloud geladen");
 }else if(this.cfg.sbUrl&&this.cfg.sbKey){
   await this.sbSave();
 }
 this.updSync();this.toast("Einstellungen gespeichert ✓");
},
async testBackend(){
 const url=(this.cfg.apiUrl||"https://websitewerk-api.onrender.com").replace(/\/$/,"");
 this.toast("Teste Backend…");
 try{
  const h=await fetch(url+"/health");
  if(!h.ok)throw new Error("HTTP "+h.status);
  const e=await fetch(url+"/env-check").then(r=>r.json());
  const missing=Object.entries(e).filter(([k,v])=>k!=="allOk"&&!v).map(([k])=>k);
  if(e.allOk)this.toast("✅ Backend OK – alle Keys gesetzt");
  else this.toast("⚠️ Backend läuft, aber fehlende Keys: "+missing.join(", "));
 }catch(err){this.toast("❌ Backend nicht erreichbar: "+err.message.slice(0,80));}
},
expState(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(this.state,null,2)],{type:"application/json"}));a.download="ww-backup-"+today()+".json";a.click();},
impState(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{this.state=JSON.parse(r.result);this.persist();this.renderAll();this.toast("Backup importiert ✓")}catch(e){this.toast("Ungültige Datei")}};r.readAsText(file);}
};
App.init();
</script>

<script>
(function(){
  var acc="#c0872b", ink="#1e1c1a", mut="#6a655d", line="#e7e3dc", soft="#f2efe9";
  function h2(t){return '<h3 style="font-size:16.5px;font-weight:800;margin:26px 0 8px;display:flex;align-items:center;gap:9px">'+t+'</h3>';}
  function card(inner){return '<div style="background:#fff;border:1px solid '+line+';border-radius:12px;padding:14px 16px;margin-bottom:10px">'+inner+'</div>';}
  function row(name,desc){return '<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid '+line+'"><b style="min-width:118px;font-weight:700">'+name+'</b><span style="color:'+mut+'">'+desc+'</span></div>';}
  function step(n,t,d){return '<div style="display:flex;gap:12px;margin-bottom:12px"><div style="flex:none;width:26px;height:26px;border-radius:8px;background:'+soft+';color:'+acc+';font-weight:800;display:grid;place-items:center;font-size:13px">'+n+'</div><div><b>'+t+'</b><div style="color:'+mut+';font-size:14px">'+d+'</div></div></div>';}
  var BODY=
    h2('🚀 So arbeitest du damit')+
    card(
      step(1,'Morgens: „Heute" öffnen','Alle fälligen Aufgaben nach Dringlichkeit — Rückrufe, At-Risk-Calls, Freigaben. Arbeite die Liste von oben ab.')+
      step(2,'Leads bewegen','In „Akquise" ziehst du Leads durch die Stufen (Discovered → … → Won). Jede Stufe löst automatische To-dos aus.')+
      step(3,'Kunden pflegen','Gewonnene Leads werden Kunden (Ansicht „Kunden") und durchlaufen den Lebenszyklus bis „Care Active".')+
      step(4,'Nichts liegt still','Eiserne Regel: jede Akte hat eine nächste Aktion mit Datum. Das Dashboard erinnert dich.')
    )+
    h2('🗂️ Die Ansichten')+
    card(
      row('⌂ Heute','Dein Startpunkt — fällige Aufgaben priorisiert, plus Conversion-Funnel.')+
      row('⚙ Akquise','Kanban-Board der Leads. Spalten = Verkaufsstufen. Ziehen = Stufe ändern.')+
      row('◉ Kunden','Kanban der Bestandskunden entlang des Pflege-Lebenszyklus.')+
      row('▦ Anfragen','Eingehende Anfragen/Projekte (Inbound).')+
      row('↗ Wachstum','Übersicht Umsatz, MRR, Pipeline-Wert, Empfehlungen.')+
      row('◎ Lead-Finder','Neue Betriebe finden & als Leads aufnehmen.')+
      row('≡ Protokoll','Lückenloses Ereignis-Log — wer/was/wann (DSGVO-Nachweis).')+
      row('✦ Einstellungen','Backend verbinden, Backup export/import, Schalter.')
    )+
    h2('📊 Die Kennzahlen oben')+
    card(
      row('MRR','Wiederkehrender Umsatz/Monat aus aktiven Care-Kunden.')+
      row('Angebote','Summe offener Angebote (Stufen Offer Sent + Negotiation).')+
      row('Sales Ready','Leads mit fertiger Demo — bereit zum Ansprechen.')+
      row('At Risk','Kunden mit Churn-Signal — brauchen Aufmerksamkeit.')+
      row('Leads / Kunden','Gesamtzahlen im System.')
    )+
    h2('🎯 Akquise-Stufen (der Trichter)')+
    card('<div style="color:'+mut+';font-size:14px">Discovered → Researching → Twin Ready → Build Queue/Running → QA → <b style="color:'+ink+'">Sales Ready</b> (Demo fertig) → Letter/Kontakt → Engaged → In Conversation → Offer Sent → Negotiation → <b style="color:#2f8a5f">Won</b>. Seitenzweige: Nurture (später), Lost, Disqualified.</div>')+
    h2('🤝 Kunden-Lebenszyklus')+
    card('<div style="color:'+mut+';font-size:14px">Onboarding → Production → Client Review → Pre-Launch → <b style="color:'+ink+'">Live</b> → Stabilization → <b style="color:#2f8a5f">Care Active</b> → Growth/Renewal. Warnzweige: At Risk, Paused, Offboarding.</div>')+
    h2('☁️ Cloud vs. Lokal')+
    card('<div style="color:'+mut+';font-size:14px">Gelbes Banner oben = <b>nicht verbunden</b>, Daten liegen nur im Browser. Für die echten Geschäftsdaten in <b>Einstellungen</b> das Backend verbinden (API-Key). Dann „Cloud-Daten laden". Ohne Verbindung siehst du Beispiel-Daten.</div>')+
    h2('⚖️ Eiserne Gesetze')+
    card('<div style="color:'+mut+';font-size:14px"><b>Keine Akte ohne nächste Aktion.</b> Kein Lead/Kunde ohne datierten nächsten Schritt — so fällt nichts durchs Raster.<br><b>Kein Outreach ohne Rechtsgrundlage.</b> Kontakt nur mit dokumentierter Grundlage (DSGVO).</div>')+
    h2('💡 Tipps')+
    card('<div style="color:'+mut+';font-size:14px">• <b>+ Lead</b> oben rechts legt schnell einen neuen Lead an.<br>• In <b>Einstellungen</b> regelmäßig <b>Backup exportieren</b>.<br>• Karten sind ziehbar (Drag &amp; Drop) zwischen den Stufen.<br>• Rot = braucht Handlung (At Risk, Blocked, Overdue).</div>')+
    '<div style="text-align:center;color:'+mut+';font-size:12px;margin-top:22px">Diese Hilfe erklärt den Leitstand — geöffnet über „? Hilfe" oben.</div>';
  window.wwHelp=function(){var b=document.getElementById("wwHelpBody");if(b&&!b.innerHTML)b.innerHTML=BODY;document.getElementById("wwHelpOv").style.display="block";document.body.style.overflow="hidden";};
  window.wwHelpClose=function(){document.getElementById("wwHelpOv").style.display="none";document.body.style.overflow="";};
  document.addEventListener("keydown",function(e){if(e.key==="Escape")wwHelpClose();});
})();
</script>

<script>
(function(){

  function base(){try{return App.apiBase();}catch(e){return '';}}
  function tfmt(ts){try{var d=new Date(ts),n=new Date();var t=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});return d.toDateString()===n.toDateString()?t:(d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})+' '+t);}catch(e){return '';}}
  function dmSetBadge(n){DM.unread=n||0;var b=el('dmBadge');if(b){if(n>0){b.textContent=n;b.style.display='inline-block';}else{b.style.display='none';}}var l=el('dmLauncher');if(l)l.style.animation=n>0?'dmPulse 1.6s ease-in-out infinite':'';dmInjectHeute();}
  function dmInjectHeute(){try{
    if(typeof App==='undefined'||App.view!=='heute')return;
    var v=el('v-heute');if(!v)return;var ex=el('dmHeuteCard');
    if(!DM.unread){if(ex)ex.remove();return;}
    if(ex){var n=ex.querySelector('.dmhc-n');if(n)n.textContent=DM.unread;return;}
    var card=document.createElement('div');card.id='dmHeuteCard';card.className='panel';card.style.cssText='cursor:pointer;border-left:4px solid #e8704a;margin-bottom:14px';
    card.onclick=function(){if(window.dmToggle)dmToggle();};
    card.innerHTML='<div class="ph">📬 Kundennachrichten</div><div style="padding:12px 14px;font-size:14px"><b class="dmhc-n">'+DM.unread+'</b> wartende Nachricht(en) von Kunden — <span style="color:#e8704a;font-weight:600">Postfach öffnen →</span></div>';
    v.insertBefore(card,v.firstChild);
  }catch(e){}}
  function dmPatchHeute(){try{if(window.App&&typeof App.rHeute==='function'&&!App._dmPatched){App._dmPatched=true;var orig=App.rHeute.bind(App);App.rHeute=function(){orig();dmInjectHeute();};}}catch(e){}}
  window.dmToggle=function(){var p=el('dmPanel'),l=el('dmLauncher');if(p.style.display==='flex'){p.style.display='none';l.style.display='flex';DM.open=false;dmBadge();return;}p.style.display='flex';l.style.display='none';DM.open=true;dmTab('inbox');};
  window.dmTab=function(t){DM.tab=t;el('dmTabInbox').style.background=t==='inbox'?'#e8704a':'rgba(255,255,255,.14)';el('dmTabAi').style.background=t==='ai'?'#e8704a':'rgba(255,255,255,.14)';
    el('dmBack').style.display='none';
    el('dmInbox').style.display=t==='inbox'?'flex':'none';el('dmChat').style.display='none';el('dmAi').style.display=t==='ai'?'flex':'none';
    if(t==='inbox')dmShowInbox();
    if(t==='ai'&&!el('dmAiMsgs').innerHTML){dmAiBubble('ki','Hey Iwas! Ich bin dein interner KI-Assistent (läuft EU/Mistral). Frag mich alles — Texte, Ideen, Kunden-Antworten formulieren, Entscheidungen.');}
  };
  window.dmShowInbox=function(){DM.cur=null;el('dmChat').style.display='none';el('dmInbox').style.display='flex';el('dmBack').style.display='none';dmLoadInbox();};
  async function dmLoadInbox(){
    var box=el('dmInboxList');box.innerHTML='<div style="padding:20px;text-align:center;color:#a99">Lädt …</div>';
    try{var r=await fetch(base()+'/api/admin/inbox');var d=await r.json();var rows=(d&&d.inbox)||[];
      if(!rows.length){box.innerHTML='<div style="padding:26px 18px;text-align:center;color:#8a8580"><div style="font-size:26px">📭</div>Noch keine Kunden-Nachrichten.</div>';dmSetBadge(0);return;}
      box.innerHTML=rows.map(function(x){
        var who=x.last?(x.last.role==='team'?'Du: ':(x.last.role==='assistant'?'KI: ':'')):'';
        var badge=x.unread?('<span style="background:#e8704a;color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;line-height:17px;border-radius:999px;text-align:center;padding:0 5px">'+x.unread+'</span>'):'';
        var flag=x.needsTeam?'<span style="font-size:10px;color:#2f9e44;font-weight:700">● wartet auf dich</span> ':'';
        return '<div onclick="dmOpen(\''+x.clientId+'\',\''+x.convId+'\')" style="display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid #efe9e3;cursor:pointer;background:'+(x.unread?'#fff6f1':'#fff')+'">'+
          '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;color:#231f1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.clientName)+' <span style="font-weight:400;color:#9a938b;font-size:11.5px">· '+esc(x.title)+'</span></div><div style="font-size:12px;color:#8a8580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+flag+esc(who+((x.last&&x.last.text)||''))+'</div></div>'+(badge||'')+'</div>';
      }).join('');
      dmSetBadge(rows.reduce(function(a,x){return a+(x.unread||0);},0));
    }catch(e){box.innerHTML='<div style="padding:20px;text-align:center;color:#c0392b">Fehler beim Laden. Ist der Leitstand-Schlüssel gesetzt?</div>';}
  }
  window.dmOpen=async function(clientId,convId){
    DM.cur={clientId:clientId,convId:convId};
    el('dmInbox').style.display='none';el('dmAi').style.display='none';el('dmChat').style.display='flex';el('dmBack').style.display='block';
    var box=el('dmChatMsgs');box.innerHTML='<div style="text-align:center;color:#a99;font-size:12px;padding:10px">Lädt …</div>';
    try{var r=await fetch(base()+'/api/admin/inbox/'+encodeURIComponent(clientId)+'/'+encodeURIComponent(convId));var d=await r.json();
      box.innerHTML='';(d.messages||[]).forEach(dmMsg);
      setTimeout(function(){var i=el('dmReplyInput');if(i)i.focus();},50);
    }catch(e){box.innerHTML='<div style="text-align:center;color:#c0392b;padding:12px">Konnte Chat nicht laden.</div>';}
  };
  function dmMsg(m){
    var box=el('dmChatMsgs');var role=m.role;
    var wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;max-width:85%;'+(role==='team'?'align-self:flex-end;align-items:flex-end':'align-self:flex-start;align-items:flex-start');
    var lblTxt=role==='customer'?'Kunde':(role==='assistant'?'KI-Assistent':'Du');
    var lbl=document.createElement('div');lbl.textContent=lblTxt;lbl.style.cssText='font-size:10px;color:#a99e93;font-weight:700;margin:0 2px 3px';wrap.appendChild(lbl);
    var b=document.createElement('div');
    b.style.cssText='padding:9px 12px;border-radius:13px;font-size:13.6px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;'+(role==='team'?'background:#231f1c;color:#fff;border-bottom-right-radius:4px':(role==='customer'?'background:#fff;color:#231f1c;border:1px solid #e6dfd8;border-bottom-left-radius:4px':'background:#f2ede8;color:#5a5550;border:1px solid #e6dfd8;border-bottom-left-radius:4px'));
    b.textContent=m.text;wrap.appendChild(b);
    var t=document.createElement('div');t.textContent=tfmt(m.ts);t.style.cssText='font-size:10px;color:#b3aca6;margin:2px 3px 0';wrap.appendChild(t);
    box.appendChild(wrap);box.scrollTop=box.scrollHeight;
  }
  window.dmReply=async function(ev){
    if(ev&&ev.preventDefault)ev.preventDefault();if(!DM.cur)return;
    var inp=el('dmReplyInput');var t=(inp.value||'').trim();if(!t)return;inp.value='';
    dmMsg({role:'team',text:t,ts:Date.now()});
    try{await fetch(base()+'/api/admin/inbox/'+encodeURIComponent(DM.cur.clientId)+'/'+encodeURIComponent(DM.cur.convId)+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});}catch(e){dmMsg({role:'assistant',text:'⚠ Senden fehlgeschlagen — bitte erneut.',ts:Date.now()});}
  };
  window.dmComposeToggle=function(){var c=el('dmCompose');var show=c.style.display==='none'||!c.style.display;if(show){var sel=el('dmClient');var cs=((typeof App!=='undefined'&&App.state&&App.state.clients)||[]).slice().sort(function(a,b){return String(a.name||'').localeCompare(String(b.name||''));});sel.innerHTML='<option value="">Kunde wählen …</option>'+cs.map(function(c2){return '<option value="'+esc(c2.id)+'">'+esc(c2.name||c2.id)+'</option>';}).join('');c.style.display='flex';}else{c.style.display='none';}};
  window.dmComposeSend=async function(){
    var id=el('dmClient').value;var t=(el('dmComposeText').value||'').trim();
    if(!id){alert('Bitte Kunde wählen');return;}if(!t){alert('Bitte Nachricht eingeben');return;}
    try{var r=await fetch(base()+'/api/admin/inbox/'+encodeURIComponent(id)+'/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});var d=await r.json();
      if(d&&d.ok){el('dmComposeText').value='';el('dmCompose').style.display='none';if(d.convId)dmOpen(id,d.convId);else dmLoadInbox();}else{alert('Fehler: '+((d&&d.error)||''));}
    }catch(e){alert('Senden fehlgeschlagen');}
  };
  function dmAiBubble(who,text){var box=el('dmAiMsgs');var d=document.createElement('div');var mine=who==='me';
    d.style.cssText='max-width:85%;padding:9px 12px;border-radius:13px;font-size:13.6px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;'+(mine?'align-self:flex-end;background:#231f1c;color:#fff;border-bottom-right-radius:4px':'align-self:flex-start;background:#fff;color:#231f1c;border:1px solid #e6dfd8;border-bottom-left-radius:4px');
    d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight;return d;}
  window.dmAiSend=async function(ev){
    if(ev&&ev.preventDefault)ev.preventDefault();
    var inp=el('dmAiInput');var q=(inp.value||'').trim();if(!q)return;inp.value='';
    dmAiBubble('me',q);DM.aiHist.push({role:'user',text:q});
    var typ=dmAiBubble('ki','…');typ.style.opacity='.55';
    try{var r=await fetch(base()+'/api/admin/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:DM.aiHist.slice(-8)})});var d=await r.json();typ.remove();
      var a=(d&&d.answer)||'Gerade nicht erreichbar.';dmAiBubble('ki',a);DM.aiHist.push({role:'assistant',text:a});
    }catch(e){typ.remove();dmAiBubble('ki','Verbindung nicht möglich.');}
  };
  window.dmBadge=async function(){
    try{var r=await fetch(base()+'/api/admin/inbox');var d=await r.json();dmSetBadge((d&&d.totalUnread)||0);}catch(e){}
  };
  try{var _st=document.createElement('style');_st.textContent='@keyframes dmPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}';document.head.appendChild(_st);}catch(e){}
  dmPatchHeute();setTimeout(dmPatchHeute,1500);
  setInterval(function(){if(DM.open&&DM.tab==='inbox'&&DM.cur===null)dmLoadInbox();else if(!DM.open)dmBadge();},30000);
  setTimeout(dmBadge,2500);
})();
</script>
</body>
</html>
